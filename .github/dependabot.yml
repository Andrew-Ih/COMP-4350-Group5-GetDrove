# Dependabot (#179): opens pull requests into develop when a dependency has an update.
# Minor and patch updates are grouped into one PR per ecosystem each week, so they don't
# flood the board; major updates get their own PR because they can break things.
# Security fixes are opened as soon as they're published, whatever the schedule.
# How to review them: docs/process/code-review.md#dependency-updates-and-security-scanning
version: 2

updates:
  # Python: the uv workspace (every service and shared library, one uv.lock)
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Frontend (web/)
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Base images in the Dockerfiles
  - package-ecosystem: docker
    directories:
      - /infra/docker
      - /infra/osrm
      - /web
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  # Actions used by our workflows
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
