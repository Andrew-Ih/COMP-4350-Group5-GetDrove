# Production stack for the live server (issue #109).
#
# The deploy workflow (.github/workflows/deploy.yml) copies this file to /opt/getdrove on
# the server, writes /opt/getdrove/.env from GitHub Secrets, and runs:
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
#
# Differences from the local stack (infra/docker-compose.yml):
#   - ready-built images from GitHub Container Registry, tagged with the commit (IMAGE_TAG)
#   - passwords and keys come from .env on the server; there are no defaults
#   - only Traefik is reachable from the internet: HTTPS on 443 for SITE_DOMAIN with a
#     Let's Encrypt certificate, and port 80 only to redirect to it (#110); no database,
#     Redis or dashboard ports, and no Mailpit: real emails go out through Brevo
#   - memory limits, log rotation, and Accounts runs in production mode
#   - OSRM runs from images with the map built in, instead of a local build
# See docs/deployment/deployment.md.

name: getdrove

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service: &service
  restart: unless-stopped
  logging: *logging
  mem_limit: 384m
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- infrastructure

  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    environment:
      POSTGRES_DB: getdrove
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?set in .env}
      TRIPS_DB_PASSWORD: ${TRIPS_DB_PASSWORD:?set in .env}
      ROUTING_DB_PASSWORD: ${ROUTING_DB_PASSWORD:?set in .env}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?set in .env}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init/20-create-service-schemas.sh:/docker-entrypoint-initdb.d/20-create-service-schemas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d getdrove"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Port 80 only redirects to HTTPS (and answers Let's Encrypt's domain check).
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # A free Let's Encrypt certificate for SITE_DOMAIN, renewed automatically before it
      # expires. Kept in the letsencrypt volume, so redeploys reuse it instead of asking
      # for a new one (Let's Encrypt limits how often a domain can ask).
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --ping=true
      # No access log: request URLs hold riders' locations (GET /api/trips/search?lat=&lng=),
      # which must never be stored. Each service logs its own requests, path only.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  # OSRM, the routing engine (#233, ADR 0008): one instance per profile, from images with
  # the Winnipeg map built in (infra/osrm/Dockerfile, built by deploy.yml), so the server
  # never prepares map data. Only the Routing service talks to them: no ports, no Traefik.
  # The image sets the health check and --verbosity WARNING (no request URLs in the logs).
  osrm-car:
    image: ${IMAGE_REGISTRY}/getdrove-osrm-car:${IMAGE_TAG}
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m

  osrm-foot:
    image: ${IMAGE_REGISTRY}/getdrove-osrm-foot:${IMAGE_TAG}
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m

  # ---------------------------------------------------------------- services
  # Same routing as locally: /api/<service> → the service with the prefix stripped,
  # /api/<service>/internal never exposed. Here only for SITE_DOMAIN, only over HTTPS, and
  # with the hsts middleware (defined on the web service below).

  accounts:
    <<: *service
    image: ${IMAGE_REGISTRY:?set in .env}/getdrove-accounts:${IMAGE_TAG:?set in .env}
    environment:
      ACCOUNTS_DATABASE_URL: postgresql+asyncpg://accounts:${ACCOUNTS_DB_PASSWORD}@postgres:5432/getdrove
      ACCOUNTS_REDIS_URL: redis://redis:6379/0
      ACCOUNTS_ENVIRONMENT: production
      ACCOUNTS_JWT_PRIVATE_KEY: ${ACCOUNTS_JWT_PRIVATE_KEY:?set in .env}
    labels:
      - traefik.enable=true
      - traefik.http.routers.accounts.rule=Host(`${SITE_DOMAIN}`) && PathPrefix(`/api/accounts`) && !PathPrefix(`/api/accounts/internal`)
      - traefik.http.routers.accounts.entrypoints=websecure
      - traefik.http.routers.accounts.tls.certresolver=letsencrypt
      - traefik.http.routers.accounts.middlewares=hsts,accounts-strip
      - traefik.http.middlewares.accounts-strip.stripprefix.prefixes=/api/accounts
      - traefik.http.services.accounts.loadbalancer.server.port=8000

  trips:
    <<: *service
    image: ${IMAGE_REGISTRY}/getdrove-trips:${IMAGE_TAG}
    environment:
      TRIPS_DATABASE_URL: postgresql+asyncpg://trips:${TRIPS_DB_PASSWORD}@postgres:5432/getdrove
      TRIPS_REDIS_URL: redis://redis:6379/0
      TRIPS_ROUTING_URL: http://routing:8000
      TRIPS_PAYMENTS_URL: http://payments:8000
      TRIPS_ACCOUNTS_URL: http://accounts:8000
      AUTH_JWKS_URL: http://accounts:8000/.well-known/jwks.json
    labels:
      - traefik.enable=true
      - traefik.http.routers.trips.rule=Host(`${SITE_DOMAIN}`) && PathPrefix(`/api/trips`) && !PathPrefix(`/api/trips/internal`)
      - traefik.http.routers.trips.entrypoints=websecure
      - traefik.http.routers.trips.tls.certresolver=letsencrypt
      - traefik.http.routers.trips.middlewares=hsts,trips-strip
      - traefik.http.middlewares.trips-strip.stripprefix.prefixes=/api/trips
      - traefik.http.services.trips.loadbalancer.server.port=8000

  routing:
    <<: *service
    image: ${IMAGE_REGISTRY}/getdrove-routing:${IMAGE_TAG}
    environment:
      ROUTING_DATABASE_URL: postgresql+asyncpg://routing:${ROUTING_DB_PASSWORD}@postgres:5432/getdrove
      ROUTING_REDIS_URL: redis://redis:6379/0
      ROUTING_OSRM_CAR_URL: http://osrm-car:5000
      ROUTING_OSRM_FOOT_URL: http://osrm-foot:5000
      AUTH_JWKS_URL: http://accounts:8000/.well-known/jwks.json
    # Routing can't compute or match routes without OSRM, so it waits for both.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm-car:
        condition: service_healthy
      osrm-foot:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.routing.rule=Host(`${SITE_DOMAIN}`) && PathPrefix(`/api/routing`) && !PathPrefix(`/api/routing/internal`)
      - traefik.http.routers.routing.entrypoints=websecure
      - traefik.http.routers.routing.tls.certresolver=letsencrypt
      - traefik.http.routers.routing.middlewares=hsts,routing-strip
      - traefik.http.middlewares.routing-strip.stripprefix.prefixes=/api/routing
      - traefik.http.services.routing.loadbalancer.server.port=8000

  payments:
    <<: *service
    image: ${IMAGE_REGISTRY}/getdrove-payments:${IMAGE_TAG}
    environment:
      PAYMENTS_DATABASE_URL: postgresql+asyncpg://payments:${PAYMENTS_DB_PASSWORD}@postgres:5432/getdrove
      PAYMENTS_REDIS_URL: redis://redis:6379/0
      AUTH_JWKS_URL: http://accounts:8000/.well-known/jwks.json
    labels:
      - traefik.enable=true
      - traefik.http.routers.payments.rule=Host(`${SITE_DOMAIN}`) && PathPrefix(`/api/payments`) && !PathPrefix(`/api/payments/internal`)
      - traefik.http.routers.payments.entrypoints=websecure
      - traefik.http.routers.payments.tls.certresolver=letsencrypt
      - traefik.http.routers.payments.middlewares=hsts,payments-strip
      - traefik.http.middlewares.payments-strip.stripprefix.prefixes=/api/payments
      - traefik.http.services.payments.loadbalancer.server.port=8000

  notifications:
    <<: *service
    image: ${IMAGE_REGISTRY}/getdrove-notifications:${IMAGE_TAG}
    environment:
      NOTIFICATIONS_DATABASE_URL: postgresql+asyncpg://notifications:${NOTIFICATIONS_DB_PASSWORD}@postgres:5432/getdrove
      NOTIFICATIONS_REDIS_URL: redis://redis:6379/0
      AUTH_JWKS_URL: http://accounts:8000/.well-known/jwks.json
      # Email goes through Brevo's SMTP relay (ADR 0010, #220), encrypted with STARTTLS.
      NOTIFICATIONS_SMTP_HOST: smtp-relay.brevo.com
      NOTIFICATIONS_SMTP_PORT: "587"
      NOTIFICATIONS_SMTP_STARTTLS: "true"
      NOTIFICATIONS_SMTP_USERNAME: ${NOTIFICATIONS_SMTP_USERNAME:?set in .env}
      NOTIFICATIONS_SMTP_PASSWORD: ${NOTIFICATIONS_SMTP_PASSWORD:?set in .env}
      # A sender verified in Brevo, e.g. "GetDrove <team@example.com>".
      NOTIFICATIONS_EMAIL_FROM: ${NOTIFICATIONS_EMAIL_FROM:?set in .env}
      # Links in emails (e.g. /verify?token=...) open the live site. SITE_URL is the site's
      # one address, set at the top of deploy.yml; each service reads it through its own
      # NOTIFICATIONS_* style setting, like the database passwords above.
      NOTIFICATIONS_WEB_BASE_URL: ${SITE_URL:?set in .env}
    labels:
      - traefik.enable=true
      - traefik.http.routers.notifications.rule=Host(`${SITE_DOMAIN}`) && PathPrefix(`/api/notifications`) && !PathPrefix(`/api/notifications/internal`)
      - traefik.http.routers.notifications.entrypoints=websecure
      - traefik.http.routers.notifications.tls.certresolver=letsencrypt
      - traefik.http.routers.notifications.middlewares=hsts,notifications-strip
      - traefik.http.middlewares.notifications-strip.stripprefix.prefixes=/api/notifications
      - traefik.http.services.notifications.loadbalancer.server.port=8000

  # ---------------------------------------------------------------- frontend

  web:
    image: ${IMAGE_REGISTRY}/getdrove-web:${IMAGE_TAG}
    restart: unless-stopped
    logging: *logging
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${SITE_DOMAIN:?set in .env}`)
      - traefik.http.routers.web.priority=1
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.routers.web.middlewares=hsts
      # Tells browsers to always use HTTPS for this site (6 months). Used by every router.
      - traefik.http.middlewares.hsts.headers.stsSeconds=15552000
      - traefik.http.services.web.loadbalancer.server.port=3000

volumes:
  postgres-data:
  redis-data:
  letsencrypt:
