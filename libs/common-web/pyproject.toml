[project]
name = "common-web"
version = "0.1.0"
description = "Shared FastAPI pieces: Problem Details errors, request IDs and JSON logging (issue #103)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "common_web"
